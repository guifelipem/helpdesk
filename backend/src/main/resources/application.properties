spring.datasource.url=jdbc:postgresql://localhost:5433/helpdesk_db
spring.datasource.username=helpdesk_user
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

app.rate-limit.auth.login-attempts=10
app.rate-limit.auth.register-attempts=5
app.rate-limit.auth.window-seconds=60
